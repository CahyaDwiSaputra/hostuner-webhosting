# ==============================================================================
# OWASP Recommended Production Security Headers
# Fulfills SRS RNF-03 (Keamanan Sistem & HTTPS Protection)
# ==============================================================================

# HTTP Strict Transport Security (HSTS) - Enforce HTTPS for 1 year
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# Prevent clickjacking attacks by only allowing framing from the same origin
add_header X-Frame-Options "SAMEORIGIN" always;

# Cross-Site Scripting (XSS) Filter protection for legacy browsers
add_header X-XSS-Protection "1; mode=block" always;

# Referrer Policy to prevent credential / query leakage to third parties
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Restrict sensitive browser features (camera, mic, geolocation, payment)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content Security Policy (Allows self, scripts, styles, fonts, and API connections)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;
