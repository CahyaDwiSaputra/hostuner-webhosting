user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning & Buffer Hardening
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version for security (RNF-03)

    # Client Request Limits (Prevent slowloris & large payloads)
    client_body_buffer_size 128k;
    client_max_body_size 10M; # Accommodate payment proof uploads
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Gzip Compression (RNF-01 - Kinerja Sistem)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS and Brute Force Mitigation - RNF-03)
    # Zone for general API requests (max 20 req/s with burst)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=20r/s;
    # Zone for authentication / login requests (max 5 req/m to prevent credential stuffing)
    limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/m;
    limit_req_status 429;

    # Logging Format with latency tracking
    log_format  main_json  escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log  /var/log/nginx/access.log  main_json;
    error_log   /var/log/nginx/error.log warn;

    # SSL Global Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Include virtual host server blocks
    include /etc/nginx/conf.d/*.conf;
}
