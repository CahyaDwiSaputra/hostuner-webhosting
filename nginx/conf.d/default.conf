# ==============================================================================
# Production Reverse Proxy Configuration
# CV. Buana Logika Utama - Sistem Penjualan Layanan Web Hosting
# ==============================================================================

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

upstream backend_upstream {
    server backend:5000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - ACME Challenge & Automatic HTTPS Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Healthcheck endpoint for Docker & load balancer probes
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Hardened Production Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificate Configuration
    # Uses Let's Encrypt certificates if mounted, or fallback self-signed
    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # Include OWASP Security Headers
    include /etc/nginx/security-headers.conf;

    # Root directory for ACME webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck probe over HTTPS
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","timestamp":"$time_iso8601"}';
    }

    # --------------------------------------------------------------------------
    # Authentication Endpoints - Strict Rate Limiting (Prevent Brute Force)
    # --------------------------------------------------------------------------
    location /api/v1/auth/ {
        limit_req zone=api_auth_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --------------------------------------------------------------------------
    # General Backend REST API
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general_limit burst=30 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Uploaded Static Assets (Payment Proofs, Invoices, Avatar)
    # Protected against PHP/script execution attacks
    # --------------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # Frontend Single Page Application (SPA)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for client updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Custom Error Handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
