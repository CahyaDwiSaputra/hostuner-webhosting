# ==============================================================================
# Development Reverse Proxy Configuration (dev.conf)
# Plain HTTP, WebSocket HMR support, no SSL requirement
# ==============================================================================

upstream dev_frontend_upstream {
    server frontend:3000;
}

upstream dev_backend_upstream {
    server backend:5000;
}

server {
    listen 80;
    server_name localhost;

    # Health check probe
    location = /nginx-health {
        default_type text/plain;
        return 200 "healthy-dev\n";
    }

    # API Routes
    location /api/ {
        proxy_pass http://dev_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://dev_backend_upstream;
        proxy_set_header Host $host;
    }

    # Frontend SPA with Vite Hot Module Reloading (WebSocket)
    location / {
        proxy_pass http://dev_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
