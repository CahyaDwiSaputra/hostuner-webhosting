# ==============================================================================
# CV. BUANA LOGIKA UTAMA - SISTEM PENJUALAN WEB HOSTING
# Production Docker Compose Configuration
# Production-hardened with Network Isolation, Health Checks & Restart Policies
# ==============================================================================

name: buana-hosting-platform

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & SSL Termination (Nginx)
  # ----------------------------------------------------------------------------
  nginx_proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: buana/nginx-proxy:1.0.0
    container_name: buana_nginx_proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Application (React SPA / Static Nginx Runner)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "${API_URL:-/api}"
        VITE_APP_NAME: "${APP_NAME:-CV. Buana Logika Utama}"
    image: buana/frontend:1.0.0
    container_name: buana_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # ----------------------------------------------------------------------------
  # 3. Backend REST API Service (Node.js Express / TypeScript)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: buana/backend:1.0.0
    container_name: buana_backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_NAME: "${APP_NAME}"
      APP_URL: "${APP_URL}"
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN}"
      UPLOAD_DIR: "/app/uploads"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      RATE_LIMIT_MAX_REQUESTS: "${RATE_LIMIT_MAX_REQUESTS:-120}"
    volumes:
      - uploads_data:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 4. Primary Relational Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: buana_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres -c max_connections=100
               -c shared_buffers=128MB
               -c effective_cache_size=256MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=8MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c work_mem=4MB
               -c min_wal_size=80MB
               -c max_wal_size=1GB
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          cpus: "0.50"
          memory: 256M

  # ----------------------------------------------------------------------------
  # 5. In-Memory Cache & Session Store (Redis 7)
  # ----------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: buana_redis_cache
    restart: unless-stopped
    command: >
      redis-server --requirepass "${REDIS_PASSWORD}"
                   --appendonly yes
                   --maxmemory 128mb
                   --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # ----------------------------------------------------------------------------
  # 6. Automated Database Backup Service (RNF-08 & WBS 7.5)
  # ----------------------------------------------------------------------------
  db_backup:
    image: postgres:16-alpine
    container_name: buana_db_backup
    restart: unless-stopped
    environment:
      PGHOST: postgres_db
      PGPORT: 5432
      PGDATABASE: "${DB_DATABASE}"
      PGUSER: "${DB_USERNAME}"
      PGPASSWORD: "${DB_PASSWORD}"
      BACKUP_DIR: /backups
      RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
    volumes:
      - postgres_backups:/backups
      - ./database/scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chmod +x /usr/local/bin/backup.sh
        echo "0 2 * * * /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        echo "Database backup daemon initiated. Scheduled daily at 02:00 UTC."
        crond -f -l 8
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

# ==============================================================================
# Isolated Network Topology
# Frontend Network: Only Reverse Proxy, Frontend, and Backend API can talk
# Backend Network: Only Backend API, PostgreSQL, Redis, and Backup daemon can talk
# ==============================================================================
networks:
  frontend_net:
    driver: bridge
    name: buana_frontend_network
  backend_net:
    driver: bridge
    name: buana_backend_network
    internal: true # No direct outside internet access to DB/Redis layer

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: buana_postgres_data
  redis_data:
    name: buana_redis_data
  postgres_backups:
    name: buana_postgres_backups
  uploads_data:
    name: buana_uploads_data
  nginx_logs:
    name: buana_nginx_logs
  backend_logs:
    name: buana_backend_logs
  certbot_www:
    name: buana_certbot_www
  certbot_conf:
    name: buana_certbot_conf
