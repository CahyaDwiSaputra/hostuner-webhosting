# ==============================================================================
# CV. BUANA LOGIKA UTAMA - SISTEM PENJUALAN WEB HOSTING
# Development Docker Compose Configuration (docker-compose.dev.yml)
# Hot-reload enabled, debug ports exposed, includes Adminer & MailHog
# ==============================================================================

name: buana-hosting-platform-dev

services:
  # ----------------------------------------------------------------------------
  # 1. Dev Nginx Proxy (HTTP only, WebSocket support for Vite HMR)
  # ----------------------------------------------------------------------------
  nginx_proxy:
    image: nginx:1.27-alpine
    container_name: buana_nginx_dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - dev_net

  # ----------------------------------------------------------------------------
  # 2. Frontend Development Server (Vite Hot Module Replacement)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: buana_frontend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_APP_NAME=CV. Buana Logika Utama (Dev)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dev_net

  # ----------------------------------------------------------------------------
  # 3. Backend Development Server (Nodemon / ts-node-dev Hot-reload)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: buana_backend_dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      APP_NAME: "CV. Buana Logika Utama Hosting (Dev)"
      APP_URL: "http://localhost:5000"
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-buana_hosting_db}"
      DB_USERNAME: "${DB_USERNAME:-buana_admin}"
      DB_PASSWORD: "${DB_PASSWORD:-buana_dev_secret_2026!}"
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-buana_redis_dev_secret!}"
      JWT_SECRET: "${JWT_SECRET:-super_secret_jwt_buana_logika_utama_dev_key_2026_at_least_64_characters}"
      UPLOAD_DIR: "/app/uploads"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - dev_net

  # ----------------------------------------------------------------------------
  # 4. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres_db:
    image: postgres:16-alpine
    container_name: buana_postgres_dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-buana_hosting_db}"
      POSTGRES_USER: "${DB_USERNAME:-buana_admin}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-buana_dev_secret_2026!}"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dev_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-buana_admin} -d ${DB_DATABASE:-buana_hosting_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 5. Redis Cache
  # ----------------------------------------------------------------------------
  redis_cache:
    image: redis:7-alpine
    container_name: buana_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD:-buana_redis_dev_secret!}"
    networks:
      - dev_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-buana_redis_dev_secret!} ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 6. Database GUI Explorer (Adminer)
  # ----------------------------------------------------------------------------
  adminer:
    image: adminer:4-standalone
    container_name: buana_adminer_dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - dev_net

  # ----------------------------------------------------------------------------
  # 7. Local SMTP Testing Server (Mailpit / Mailhog)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: buana_mailpit_dev
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port
    networks:
      - dev_net

networks:
  dev_net:
    driver: bridge
    name: buana_dev_network

volumes:
  dev_postgres_data:
